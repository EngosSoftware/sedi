[package]
name = "sedi"
version = "0.1.1"
authors = ["Dariusz Depta <depta@engos.de>"]
description = "Inplace stream editor"
documentation = "https://docs.rs/sedi"
repository = "https://github.com/EngosSoftware/sedi.git"
keywords = ["inplace", "stream", "editor"]
license = "MIT OR Apache-2.0"
rust-version = "1.88.0"
edition = "2024"
include = [
    "src/**",
    "tests/**",
    "docs/**/*.rs.md",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE*",
    "README.md"
]

[dependencies]
clars = "0.3.1"
glob = "0.3.4"
regex = "1.13.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
